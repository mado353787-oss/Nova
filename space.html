<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جزيئات فضائية</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(ellipse at 18% 25%,rgba(110,50,190,.38),transparent 55%),radial-gradient(ellipse at 82% 72%,rgba(25,90,190,.33),transparent 55%),radial-gradient(ellipse at 60% 8%,rgba(190,40,120,.2),transparent 50%),#02030a}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cam{position:fixed;top:12px;left:12px;width:90px;height:68px;border-radius:10px;object-fit:cover;transform:scaleX(-1);opacity:.55;display:none}
#status{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));width:100%;text-align:center;font-size:15px;color:#cfe;text-shadow:0 0 10px #7af;pointer-events:none}
#bar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:0 8px;z-index:3}
#bar button{border:1px solid #3a4a8a;background:rgba(10,14,40,.7);color:#cfe;border-radius:999px;padding:6px 10px;font-size:13px}
#start{position:fixed;inset:0;z-index:5;background:rgba(2,3,10,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#start button{font-size:18px;padding:13px 28px;border:0;border-radius:999px;background:#6f8bff;color:#fff;font-weight:700}
#start button#skip{background:#1a2040;font-size:15px;padding:10px 22px}
#start p{margin:0;max-width:340px;line-height:1.9;font-size:14px;opacity:.85}
#pal{position:fixed;top:calc(46px + env(safe-area-inset-top,0px));left:8px;right:8px;max-height:46vh;overflow-y:auto;z-index:4;background:rgba(8,10,30,.94);border:1px solid #3a4a8a;border-radius:16px;padding:10px;display:none;flex-wrap:wrap;gap:8px;justify-content:center}
#pal .sw{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.35);padding:0}
#pal .gr{width:56px;border-radius:16px}
#pal h4{width:100%;margin:4px 0 0;font-size:12px;opacity:.7;text-align:center;font-weight:400}
#pal button.t{border:1px solid #3a4a8a;background:rgba(20,24,60,.8);color:#cfe;border-radius:999px;padding:6px 12px;font-size:13px}
#pal input[type=color]{width:50px;height:34px;border:0;padding:0;background:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="cam" playsinline muted></video>
<div id="status"></div>
<div id="bar"></div>
<div id="start">
  <button id="go">ابدأ بالكاميرا</button>
  <button id="skip">من غير كاميرا (باللمس)</button>
  <p>غيّر الشكل بعدد صوابعك قدام الكاميرا (1 إلى 5)، أو من الأزرار تحت<br>✊ قبضة = مذنب<br>اسحب بصباع لتحريك الشكل، وصباعين (pinch) للتكبير</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
(function(){
  var N=6500,canvas=document.getElementById('c'),statusEl=document.getElementById('status');
  var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x000000,0);
  var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,1,0.1,90);camera.position.z=5;
  function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
  addEventListener('resize',resize);resize();

  function rnd(a,b){return a+Math.random()*(b-a)}
  function make(fn){var a=new Float32Array(N*3);for(var i=0;i<N;i++){var p=fn(i,i/N);a[i*3]=p[0];a[i*3+1]=p[1];a[i*3+2]=p[2]}return a}
  function rotX(p,a){var c=Math.cos(a),s=Math.sin(a);return[p[0],p[1]*c-p[2]*s,p[1]*s+p[2]*c]}
  function rotZ(p,a){var c=Math.cos(a),s=Math.sin(a);return[p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]]}
  function onSphere(r){var u=rnd(0,6.2832),v=Math.acos(rnd(-1,1));return[r*Math.sin(v)*Math.cos(u),r*Math.cos(v),r*Math.sin(v)*Math.sin(u)]}

  // ---------- الأشكال وخواصها ----------
  var S=[
   {label:'🌪️ إعصار — بيلف وبيغيّر اتجاهه',c1:0x2fe0ff,c2:0xffffff,gen:function(i,t){var y=t*3.4-1.7,r=(0.1+t*1.35)*rnd(.85,1.15),a=t*55+rnd(-.6,.6);return[Math.cos(a)*r,y,Math.sin(a)*r]}},
   {label:'⚔️ سيوف — كل جزيء سيف وردي',c1:0xff4fa8,c2:0xff9ad5,swords:true,gen:function(){var p=onSphere(1.8*Math.cbrt(Math.random()));return[p[0]*1.1,p[1]*1.1,p[2]*1.1]}},
   {label:'❤️ قلب — بينبض',c1:0xff2d55,c2:0xff9ab0,gen:function(){var t=rnd(0,6.2832),s=Math.sqrt(Math.random())*.95+.05,x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);return[x/13*1.3*s,(y/13*1.3+.1)*s,rnd(-.3,.3)*s]}},
   {label:'🌌 مجرة — بتلمع',c1:0x9b5cff,c2:0xffb347,gen:function(i){var r=Math.pow(Math.random(),.7)*2.3,a=r*2.4+(i%2)*Math.PI+rnd(-.35,.35)*(.4+r*.2);return rotX([Math.cos(a)*r,rnd(-.1,.1)*(1.4-r*.4),Math.sin(a)*r],.9)}},
   {label:'🪐 كوكب بحلقة',c1:0xffd36b,c2:0xff7a3d,gen:function(){var p;if(Math.random()<.55)p=onSphere(.85);else{var a=rnd(0,6.2832),r=rnd(1.25,2.05);p=[Math.cos(a)*r,rnd(-.03,.03),Math.sin(a)*r]}return rotZ(rotX(p,.5),.35)}},
   {label:'☄️ مذنب — بيعدّي في الفضا',c1:0x7dffd4,c2:0x4a7dff,gen:function(){var p;if(Math.random()<.3){p=onSphere(.35*Math.cbrt(Math.random()));p[0]+=1.7}else{var u=Math.random();p=[1.7-u*4.2,rnd(-1,1)*(.12+u*.5),rnd(-1,1)*(.12+u*.5)]}return rotZ(p,-.25)}},
   {label:'☀️ شمس — بتنبض وبتطلّع أشعة',c1:0xffd400,c2:0xff4a00,gen:function(i){if(Math.random()<.6)return onSphere(.95*Math.cbrt(Math.random()));var k=i%24,y=1-2*(k+.5)/24,r=Math.sqrt(1-y*y),a=k*2.39996,L=1.05+Math.random();return[Math.cos(a)*r*L+rnd(-.05,.05),y*L+rnd(-.05,.05),Math.sin(a)*r*L+rnd(-.05,.05)]}},
   {label:'✨ اسمك — بالجزيئات',c1:0x59f0ff,c2:0xff7ac8,gen:function(){var q=namePts(),pt=q[(Math.random()*q.length)|0];return[pt[0]+rnd(-.012,.012),pt[1]+rnd(-.012,.012),rnd(-.05,.05)]}}
  ];
  function namePts(text){
    if(text!==undefined){namePts.t=text;namePts.q=null}if(namePts.q)return namePts.q;if(!namePts.t)namePts.t='محمد';
    var c=document.createElement('canvas');c.width=640;c.height=240;var x=c.getContext('2d'),fs=170,f=function(){x.font='bold '+fs+'px Tahoma,"Segoe UI",Arial,sans-serif'};
    x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';f();
    while(x.measureText(namePts.t).width>580&&fs>40){fs-=10;f()}
    x.fillText(namePts.t,320,125);
    var d=x.getImageData(0,0,640,240).data,q=[];
    for(var y=0;y<240;y+=2)for(var X=0;X<640;X+=2)if(d[(y*640+X)*4+3]>128)q.push([(X/640-.5)*4.4,-(y/240-.5)*1.65]);
    if(!q.length)q.push([0,0]);namePts.q=q;return q;
  }
  var kk=new Float32Array(N);for(var i=0;i<N;i++)kk[i]=Math.random();
  S[0].c1=0x1b5bff;S[0].c2=0x2fe8ff;S[0].c3=0xeaffff;

  S[4].c1=0xe8b86a;S[4].c2=0xc98a4b;S[4].c3=0xfff1d0;
  S[3].cf=function(c,x,y,z,k){var r=Math.min(1,Math.hypot(x,y,z)/2.2);c.setRGB(1,.85,.55).lerp(new THREE.Color(.55,.35,1),Math.min(1,r*1.6)).lerp(new THREE.Color(.3,.6,1),Math.max(0,r-.55)*1.2);c.multiplyScalar(.7+.3*k)};
  S[5].cf=function(c,x,y,z,k){var u=Math.min(1,Math.max(0,(1.9-x)/4.4));c.setRGB(.9,1,1).lerp(new THREE.Color(.25,.55,1),Math.min(1,u*1.4)).multiplyScalar(1-u*.3+.1*k)};
  S[6].cf=function(c,x,y,z,k){var r=Math.min(1,Math.hypot(x,y,z)/2.1);c.setRGB(1,.98,.75).lerp(new THREE.Color(1,.62,.1),Math.min(1,r*1.5)).lerp(new THREE.Color(.95,.2,.05),Math.max(0,r-.55)*1.6)};
  // ☀️ شمس واقعية: سطح متحبّب + بقع شمسية + انفجارات (قوس بلازما) + إكليل

  S[6].label='☀️ شمس — سطح متحبّب وبقع وانفجارات';
  S[6].gen=function(i){var m=i%20;
    if(m<14)return onSphere(1+rnd(-.025,.025));
    if(m<17){var L=sunLoops[((i/20)|0)%12],u=Math.random()*Math.PI,cu=Math.cos(u)*L.r,su=Math.sin(u)*L.r*1.3;return[L.d[0]*(1+su)+L.t[0]*cu+rnd(-.015,.015),L.d[1]*(1+su)+L.t[1]*cu+rnd(-.015,.015),L.d[2]*(1+su)+L.t[2]*cu+rnd(-.015,.015)]}
    return onSphere(1.1+Math.pow(Math.random(),2)*1.2)};
  S[6].cf=function(c,x,y,z,k,i){var m=i%20,r=Math.hypot(x,y,z)||1;
    if(m>=17){c.setRGB(1,.78,.45).multiplyScalar(.3+.4*k);return}
    if(m>=14){c.setRGB(1,.32,.08).multiplyScalar(.85+.3*k);return}
    var f=Math.abs(z)/r,gn=Math.sin(x*16)*Math.sin(y*16+z*6)*Math.sin(z*16),nx=x/r,ny=y/r,nz=z/r;
    c.setRGB(1,.42+.5*f,.06+.55*f*f).multiplyScalar(.85+.15*gn+.12*k);
    if(nx*.33+ny*.25+nz*.91>.955||nx*-.5+ny*-.2+nz*.84>.96)c.multiplyScalar(.28)};
  // أشكال جديدة
  S.push({label:'🌍 الأرض — محيطات وقارات وسحب',c1:0x1a5fd0,c2:0x2aa0ff,
    gen:function(i){return i%6===0?onSphere(1.14+Math.random()*.08):onSphere(1.05)},
    cf:function(c,x,y,z,k){var r=Math.hypot(x,y,z)||1,nx=x/r,ny=y/r,nz=z/r;
      if(r>1.1){c.setRGB(.4,.7,1).multiplyScalar(.25+.35*k);return}
      var land=Math.sin(2.3*nx+1.1)*Math.cos(2.9*ny+.4)+.7*Math.sin(3.1*nz-.7)*Math.cos(2.2*nx)+.35*Math.sin(6*nx+5*ny+4*nz);
      if(Math.abs(ny)>.88)c.setRGB(.95,.97,1);
      else if(land>.55){var g=.5+.5*Math.sin(7*nx+5*ny);c.setRGB(.15+.4*g,.5-.1*g,.14+.08*g)}
      else c.setRGB(.03+.05*k,.2+.2*k,.55+.25*k);
      if(Math.sin(9*nx+3*ny)*Math.sin(8*nz+2*nx)>.55)c.setRGB(.92,.94,.98);
      c.multiplyScalar(.5+.5*Math.abs(nz))}});
  S.push({label:'🌙 القمر — فوهات وبحار',c1:0xaaaaaa,c2:0xdddddd,gen:function(){return onSphere(1.02)},
    cf:function(c,x,y,z,k){var r=Math.hypot(x,y,z)||1,nx=x/r,ny=y/r,nz=z/r,b=.5+.28*k;c.setRGB(b,b*.98,b*.93);
      if(Math.sin(2.2*nx+1)*Math.sin(2.6*ny)>.45)c.multiplyScalar(.62);
      if(Math.sin(10*nx)*Math.sin(10*ny+2)*Math.sin(10*nz+1)>.4)c.multiplyScalar(.5);
      c.multiplyScalar(.45+.55*Math.abs(nz))}});
  S.push({label:'🕳️ ثقب أسود — قرص وعدسة جذب',c1:0xffaa33,c2:0xffffff,
    gen:function(i){if(i%7===0){var a=rnd(0,6.2832),r=1.02+rnd(-.03,.03);return[Math.cos(a)*r,Math.sin(a)*r,rnd(-.03,.03)]}
      var a2=rnd(0,6.2832),r2=1+Math.pow(Math.random(),1.4)*1.7;return rotX([Math.cos(a2)*r2,rnd(-.03,.03)*r2,Math.sin(a2)*r2],.3)},
    cf:function(c,x,y,z,k,i){if(i%7===0){c.setRGB(1,.88,.65).multiplyScalar(.9+.2*k);return}
      var r=Math.hypot(x,y,z);if(r<1.4)c.setRGB(.85,.92,1);else if(r<1.9)c.setRGB(1,.72,.25);else c.setRGB(.9,.25,.07);c.multiplyScalar(.7+.4*k)}});
  S.push({label:'🛸 طبق طائر — بأضواء وشعاع',c1:0xb8c4e0,c2:0x66ffdd,
    gen:function(i){var m=i%10,a=rnd(0,6.2832),p;
      if(m<2){p=onSphere(.55);p[1]=Math.abs(p[1])+.12}
      else if(m<7){var rr=Math.sqrt(Math.random())*1.7;p=[Math.cos(a)*rr,rnd(-1,1)*.2*(1-rr*rr/2.9),Math.sin(a)*rr]}
      else if(m===7){var q=(((i/10)|0)%12)*.5236;p=[Math.cos(q)*1.45,-.1,Math.sin(q)*1.45]}
      else{var y=-.25-Math.random()*1.4,rb=(.25+(-.25-y)*.55)*Math.sqrt(Math.random());p=[Math.cos(a)*rb,y,Math.sin(a)*rb]}
      return rotX(p,.35)},
    cf:function(c,x,y,z,k,i){var m=i%10;
      if(m<2)c.setRGB(.5,.9,1).multiplyScalar(.7+.3*k);
      else if(m<7)c.setRGB(.72,.78,.9).multiplyScalar(.55+.45*k);
      else if(m===7){if((((i/10)|0)%2)===0)c.setRGB(1,.9,.3);else c.setRGB(1,.3,.65)}
      else c.setRGB(.6,1,.5).multiplyScalar(.3+.3*k)}});
  S.push({label:'🚀 صاروخ — بلهب',c1:0xffffff,c2:0xff3b3b,
    gen:function(i){var m=i%10,a=rnd(0,6.2832),p;
      if(m<4)p=[Math.cos(a)*.32,rnd(-.8,.7),Math.sin(a)*.32];
      else if(m<6){var h=Math.random()*.75;p=[Math.cos(a)*.32*(1-h/.75),.7+h,Math.sin(a)*.32*(1-h/.75)]}
      else if(m<8){var fa=(((i/10)|0)%3)*2.0944,e=Math.random()*.5,yy=-.8+Math.random()*.6*(1-e/.5);p=[Math.cos(fa)*(.32+e),yy,Math.sin(fa)*(.32+e)]}
      else{var h2=Math.pow(Math.random(),.8)*1.1,rr2=.28*(1-h2/1.1)*Math.sqrt(Math.random());p=[Math.cos(a)*rr2,-.8-h2,Math.sin(a)*rr2]}
      return[p[0]*1.5,p[1]*1.5-.1,p[2]*1.5]},
    cf:function(c,x,y,z,k,i){var m=i%10;
      if(m>=8){var h=Math.min(1,Math.max(0,(-y/1.5-.87)/1.1));c.setRGB(1,.95-.6*h,.6-.55*h).multiplyScalar(.8+.3*k)}
      else if(m>=4)c.setRGB(.95,.2,.2).multiplyScalar(.8+.2*k);
      else c.setRGB(.9,.93,1).multiplyScalar(.6+.4*k)}});
  // أشكال حبال جديدة
  S.push({label:'🧬 DNA — حبلين ملفوفين',c1:0x28ffb0,c2:0xff4fd8,
    gen:function(i){var m=i%3,y=rnd(-1.7,1.7),a=y*3.2;
      if(m===0)return[Math.cos(a)*.7+rnd(-.02,.02),y,Math.sin(a)*.7];
      if(m===1)return[Math.cos(a+Math.PI)*.7,y,Math.sin(a+Math.PI)*.7+rnd(-.02,.02)];

    cf:function(c,x,y,z,k,i){var m=i%3;if(m===0)c.setRGB(.15,1,.7);else if(m===1)c.setRGB(1,.3,.85);else c.setRGB(.9,.95,1).multiplyScalar(.6+.4*k)}});

    gen:function(){var t=rnd(0,6.2832),s=.42;return[(Math.sin(t)+2*Math.sin(2*t))*s+rnd(-.03,.03),(Math.cos(t)-2*Math.cos(2*t))*s+rnd(-.03,.03),-Math.sin(3*t)*s*1.4+rnd(-.03,.03)]}});
  S.push({label:'⚛️ ذرة — نواة ومدارات',c1:0x59f0ff,c2:0xffd36b,
    gen:function(i){var m=i%4;if(m===3)return onSphere(.32*Math.cbrt(Math.random()));var a=rnd(0,6.2832),p=[Math.cos(a)*1.7,Math.sin(a)*.65,0];p=rotX(p,m*1.0472);return rotZ(p,m*.9)},
    cf:function(c,x,y,z,k,i){if(i%4===3)c.setRGB(1,.85,.4).multiplyScalar(.8+.4*k);else c.setRGB(.3,.9,1).multiplyScalar(.6+.4*k)}});
  S.push({label:'♾️ لانهاية',c1:0xff5ec4,c2:0x6be4ff,
    gen:function(){var t=rnd(0,6.2832),d=1+Math.sin(t)*Math.sin(t);return[2.4*Math.cos(t)/d+rnd(-.03,.03),2.4*Math.sin(t)*Math.cos(t)/d*1.8+rnd(-.03,.03),rnd(-.08,.08)]}});
  S.push({label:'🌐 شبكة — خطوط طول وعرض',c1:0x3ad1ff,c2:0x9b6bff,
    gen:function(i){var m=i%2,n=((i/2)|0)%12;if(m===0){var a=rnd(0,6.2832),th=(n+.5)/12*Math.PI;return[Math.cos(a)*Math.sin(th)*1.3,Math.cos(th)*1.3,Math.sin(a)*Math.sin(th)*1.3]}
      var lo=n/12*6.2832,ph=rnd(0,Math.PI);return[Math.cos(lo)*Math.sin(ph)*1.3,Math.cos(ph)*1.3,Math.sin(lo)*Math.sin(ph)*1.3]}});
  S.push({label:'🌸 وردة — بتلات',c1:0xff7ac8,c2:0xffe0f0,
    gen:function(){var t=rnd(0,12.566),r=Math.cos(2.5*t)*1.6*(.85+.15*Math.random());return[Math.cos(t)*r,Math.sin(t)*r,rnd(-.08,.08)]}});
  // أشكال إضافية
  var rbCols=[[.55,.2,1],[.3,.2,.95],[.2,.5,1],[.2,.9,.4],[1,.95,.2],[1,.55,.1],[1,.15,.15]],lx=[.3,-.4,.35,-.3,.45,-.25,.35,-.35,.15,-.1];
  S.push({label:'🌈 قوس قزح — 7 ألوان',c1:0xffffff,c2:0xffffff,

    cf:function(c,x,y,z,k,i){var q=rbCols[i%7];c.setRGB(q[0],q[1],q[2]).multiplyScalar(.75+.35*k)}});
  S.push({label:'⭐ نجمة — خمس أطراف',c1:0xfff2a0,c2:0xffb300,
